//CONTRACT: FOUR TOURIST CONTRACT
CONTRACT_TYPE
{
    name = Tourism_InterplanetarySiteVist4Tourist
    group = interplanetary
    genericTitle = Ferry four tourists to see one of our mission sites.
    genericDescription = Ferry four tourists to a mission site and bring them back safely.

    title = Ferry @TourismOverhaul:touristCount.Print() @TourismOverhaul:tourists to @targetVessel
    description = One of our tourist agencies has realized that tourists will be willing to pay extra to visit one of our landing sites. They say it has more sightseeing value. In fact, they have a list of tourists right now who are ready to visit @targetVessel
    synopsis = Ferry four tourists to @targetVessel and return them safely to @/homeWorldPlanet
    completedMessage = The @TourismOverhaul:tourists had a great time!

    // Level 1 prestige
    prestige = Exceptional
	targetBody = @targetVessel.CelestialBody()

    // Contract rewards
    rewardFunds = 2000 + Random(0.0, 3000.0)
    rewardReputation = 8.0
    failureReputation = 9.0
	
	// Quickly Expire & Deadline
	minExpiry = 6.0
	maxExpiry = 25.0	
	deadline = Random(9372, 12780)
	
	//first tourist
	PARAMETER
	{
		name = All
		type = All
		title = Complete @/randomKerbalName1's travel itinerary
	
		PARAMETER
		{
			name = VesselParameterGroup
			type = VesselParameterGroup
			
			title = Land within 400m of @/targetVessel
			PARAMETER
			{
				name = HasPassengers1
				type = HasPassengers
				kerbal = @/randomKerbalName1
				hideChildren = true
				hidden = true
			}
			
			PARAMETER
			{
				name = ReachState
				type = ReachState
				situation = LANDED
				hidden = true
			}

			PARAMETER
			{
				name = Rendezvous
				type = Rendezvous
				vessel = @/targetVessel
				hideChildren = true
				hidden = true
				distance = 400
			}
		}	
	
		PARAMETER
		{
			name = RecoverKerbal
			type = RecoverKerbal
			kerbal = @/randomKerbalName1
			completeInSequence = true
			rewardFunds = (68000 + Random(0000.0, 1000.0))
		}
	}
	
	
	//second tourist
	PARAMETER
	{
		name = All
		type = All
		title = Complete @/randomKerbalName2's travel itinerary
	
		PARAMETER
		{
			name = VesselParameterGroup
			type = VesselParameterGroup
			
			title = Land within 400m of @/targetVessel
			PARAMETER
			{
				name = HasPassengers2
				type = HasPassengers
				kerbal = @/randomKerbalName2
				hideChildren = true
				hidden = true
			}
			
			PARAMETER
			{
				name = ReachState
				type = ReachState
				situation = LANDED
				hidden = true
			}

			PARAMETER
			{
				name = Rendezvous
				type = Rendezvous
				vessel = @/targetVessel
				hideChildren = true
				hidden = true
				distance = 400
			}
		}	
	
		PARAMETER
		{
			name = RecoverKerbal
			type = RecoverKerbal
			kerbal = @/randomKerbalName2
			completeInSequence = true
			rewardFunds = (68000 + Random(0000.0, 1000.0))
		}
	}
	
	//third tourist
	PARAMETER
	{
		name = All
		type = All
		title = Complete @/randomKerbalName3's travel itinerary
	
		PARAMETER
		{
			name = VesselParameterGroup
			type = VesselParameterGroup
			
			title = Land within 400m of @/targetVessel
			PARAMETER
			{
				name = HasPassengers3
				type = HasPassengers
				kerbal = @/randomKerbalName3
				hideChildren = true
				hidden = true
			}
			
			PARAMETER
			{
				name = ReachState
				type = ReachState
				situation = LANDED
				hidden = true
			}

			PARAMETER
			{
				name = Rendezvous
				type = Rendezvous
				hideChildren = true
				vessel = @/targetVessel
				hidden = true
				distance = 400
			}
		}	
	
		PARAMETER
		{
			name = RecoverKerbal
			type = RecoverKerbal
			kerbal = @/randomKerbalName3
			completeInSequence = true
			rewardFunds = (68000 + Random(0000.0, 1000.0))
		}
	}
	
	//fourth tourist
	PARAMETER
	{
		name = All
		type = All
		title = Complete @/randomKerbalName4's travel itinerary
	
		PARAMETER
		{
			name = VesselParameterGroup
			type = VesselParameterGroup
			
			title = Land within 400m of @/targetVessel
			PARAMETER
			{
				name = HasPassengers4
				type = HasPassengers
				kerbal = @/randomKerbalName4
				hideChildren = true
				hidden = true
			}
			
			PARAMETER
			{
				name = ReachState
				type = ReachState
				situation = LANDED
				hidden = true
			}

			PARAMETER
			{
				name = Rendezvous
				type = Rendezvous
				hideChildren = true
				hidden = true
				vessel = @/targetVessel
				distance = 400
			}
		}	
	
		PARAMETER
		{
			name = RecoverKerbal
			type = RecoverKerbal
			kerbal = @/randomKerbalName4
			completeInSequence = true
			rewardFunds = (68000 + Random(0000.0, 1000.0))
		}
	}
	
	DATA
    {
        type = Vessel
        uniquenessCheck = CONTRACT_ACTIVE
        title = Generates targetVessel
		hidden = true
        targetVessel = AllVessels().Where(v => v.VesselType() == Flag || v.VesselType() == Base || v.VesselType() == Probe || v.VesselType() == Lander).Where(v => Sun().Children().Contains(v.CelestialBody()) && v.IsLanded()).Random()
    }
	
	DATA
	{
		type = string
		title = getTargetBodyasString
		hidden = true
		targetBodyString = @/targetBody
	}
	
	DATA
	{
		type = Kerbal
		title = randomly generates name for first tourist
		randomKerbalName1 = NewKerbal(Random(), @TourismOverhaul:prefixes.Random() + @TourismOverhaul:suffixes.Random() + " Kerman")
		hidden = true
	}
	DATA
	{
		type = Kerbal
		title = randomly generates name for first tourist
		randomKerbalName2 = NewKerbal(Random(), @TourismOverhaul:prefixes.Random() + @TourismOverhaul:suffixes.Random() + " Kerman")
		hidden = true
	}
	DATA
	{
		type = Kerbal
		title = randomly generates name for first tourist
		randomKerbalName3 = NewKerbal(Random(), @TourismOverhaul:prefixes.Random() + @TourismOverhaul:suffixes.Random() + " Kerman")
		hidden = true
	}
	DATA
	{
		type = Kerbal
		title = randomly generates name for first tourist
		randomKerbalName4 = NewKerbal(Random(), @TourismOverhaul:prefixes.Random() + @TourismOverhaul:suffixes.Random() + " Kerman")
		hidden = true
	}
	
	DATA 
	{
		type = CelestialBody
		hidden = true
		homeWorldPlanet = HomeWorld()
	}
	DATA 
	{
		type = Duration 
		title = Duration Time generator
		hidden = true 
		durationTime = Random(7d, 14d)
	}
	
    BEHAVIOUR
    {
        name = SpawnPassengers1
        type = SpawnPassengers
		kerbal = @/randomKerbalName1
    }
	BEHAVIOUR
    {
        name = SpawnPassengers2
        type = SpawnPassengers
		kerbal = @/randomKerbalName2
    }
	BEHAVIOUR
    {
        name = SpawnPassengers3
        type = SpawnPassengers
		kerbal = @/randomKerbalName3
    }
	BEHAVIOUR
    {
        name = SpawnPassengers4
        type = SpawnPassengers
		kerbal = @/randomKerbalName4
    }


    BEHAVIOUR
    {
        name = Expression
        type = Expression

        CONTRACT_COMPLETED_SUCCESS
        {
            TouristCount = TouristCount + @TourismOverhaul:touristCount
            TouristLowOrbitCount = TouristLowOrbitCount + @TourismOverhaul:touristCount
        }
    }
	
	REQUIREMENT
	{
		type = All
		name = All
		title = Must have 200 reputation and must have tourists willing to book with our agency
		hideChildren = true

        REQUIREMENT
        {
            name = Reputation
            type = Reputation
			title = Reputation
            minReputation = 200
        }
		REQUIREMENT 
		{
			name = FlyBy
			type = FlyBy
			checkType = MANNED
			title = Visit @/targetBody
			targetBody = @/targetBody
		}
		REQUIREMENT
		{
			name = Expression
			type = Expression
			expression = @TourismOverhaul:touristCount == 4
			title = touristCount generator
			hidden = true
		}
		REQUIREMENT
		{
			name = Expression
			type = Expression
			expression = @targetBody != HomeWorld()
			title = Must not be homeworld
			hidden = true
		}
	}
}
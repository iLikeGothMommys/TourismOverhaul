//	CONTRACT: ELEVENTH CONTRACT
CONTRACT_TYPE
{
    name = Tourism_Interplanetary11Tourist
    group = InterplanetaryOrbit
	sortKey = 092.InterplanetaryOrbit11
    genericTitle = Ferry eleven tourists into orbit around another planet
    genericDescription = Ferry eleven tourists into orbit around another planet and bring them back safely.
    title = Ferry eleven tourists into orbit around @targetBody
    description = @/interplanetaryMessagesNoLandingSingleTourst.Random()
    synopsis = Ferry eleven tourists to @targetBody and return them safely to @/homeWorldPlanet
    completedMessage = The eleven tourists had a great time!
    // Level 1 prestige
    prestige = Exceptional
    targetBody = ReturnedFromBodies().Where(b => !b.IsSun() && b.HasSurface() && !b.IsHomeWorld() && b.Parent() != HomeWorld() && (b.Parent() == HomeWorld().Parent() || b.Parent().Parent() == HomeWorld().Parent()) && b.Parent().SemiMajorAxis() < 845252514114).Random()
    // Contract rewards
    rewardFunds = 2000 + Random(0.0, 3000.0)
    rewardReputation = 8.0
    failureReputation = 9.0
	// Quickly Expire & Deadline
	minExpiry = 6.0
	maxExpiry = 7.0	
	deadline = Random(9372, 12780)
	
	// --- PARAMETER BLOCK for Tourist 1 ---
	PARAMETER
	{
		name = All
		type = All
		title = Complete @/randomKerbalName1's travel itinerary
		PARAMETER
		{
			name = VesselParameterGroup
			type = VesselParameterGroup
			title = Orbit @/targetBody
			PARAMETER
			{
				name = HasPassengers1
				type = HasPassengers
				kerbal = @/randomKerbalName1
				hideChildren = true
				hidden = true
			}
			PARAMETER
			{
				name = Orbit
				type = Orbit
				title = Orbit @/targetBody
				hideChildren = true
				hidden = true
				minPeA = @/targetBody.AtmosphereAltitude() + 1
			}
			PARAMETER
			{
				name = ReachState
				type = ReachState
				optional = true
				title = BONUS: Land on the surface of @/targetBody
				hideChildren = true
				hidden = false
				situation = LANDED
				rewardFunds = 17000 + Random(3000.0, 4000.0)
				REQUIREMENT
				{
					name = Expression
					type = Expression
					expression = @TourismOverhaul:oneThirdChance == 2
					title = Must have one tourist who is willing to book a tour with our agency
				}
			}
		}
		PARAMETER
		{
			name = RecoverKerbal
			type = RecoverKerbal
			completeInSequence = true
			rewardFunds = 37000 + Random(4000.0, 6000.0)
			kerbal = @/randomKerbalName1
		}
	}
	

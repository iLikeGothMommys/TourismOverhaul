		interplanetaryMessagesNoLandingSingleTourst = [ "A space tourism enthusiast has expressed a keen interest in experiencing the awe-inspiring beauty of @/targetBody. We need you to ferry these tourists to @targetBody and safely return them to @/homeWorldPlanet.", "A private tourist has booked a once-in-a-lifetime opportunity to visit @/targetBody. They are seeking a reliable spaceflight provider to make this dream a reality. That is where we come in.", "A thrill-seeking tourist has requested a trip to @targetBody. They are eager to witness its beauty from space and experience the unique environment of orbital flight.", "A tourist with a thirst for adventure has requested an unforgettable journey to visit @/targetBody. They want to experience the beauty of @/targetBody firsthand and return safely to @/homeWorldPlanet to share their story. It's a bold request, but that's where we come in.", "An adventurous tourist has decided that life on @/homeWorldPlanet just isn’t exciting enough and wants to take a scenic trip to visit @/targetBody. They’re hoping for breathtaking views, a few zero-gravity snacks, and a smooth ride back home to brag about it.", "A tourist has decided that looking up at @/targetBody from @/homeWorldPlanet just isn’t good enough—they want to see it up close! Their dream is to visit the planet, enjoy the cosmic sights, and then return home safely with tales of their adventure.", "A tourist reached out to us asking for a trip to visit @/targetBody and a safe return to @/homeWorldPlanet. This journey will provide a unique orbital experience and showcase the capabilities of your space program." ]
